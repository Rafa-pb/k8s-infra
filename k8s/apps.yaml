# --- APLICAÇÃO 1: CPU-BOUND ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poi-app-cpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poi-app-cpu
  template:
    metadata:
      labels:
        app: poi-app-cpu
    spec:
      containers:
        - name: poi-app-cpu
          image: andretharssys/poi-app-cpu:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: poi-app-cpu-service
spec:
  type: ClusterIP
  selector:
    app: poi-app-cpu
  ports:
    - port: 8000
      targetPort: 8000
---
