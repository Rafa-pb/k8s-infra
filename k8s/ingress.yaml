apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poi-apps-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /cpu(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: poi-app-cpu-service
                port:
                  number: 8000
          - path: /memory(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: poi-app-memory-service
                port:
                  number: 8000
          - path: /io(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: poi-app-io-service
                port:
                  number: 8000