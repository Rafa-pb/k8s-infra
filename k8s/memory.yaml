apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-memory
spec:
  replicas: 2
  selector:
    matchLabels: { app: app-memory }
  template:
    metadata:
      labels: { app: app-memory }
    spec:
      containers:
      - name: app
        image: app-memory:1.0
        imagePullPolicy: Never
        ports: [{ containerPort: 8080 }]
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { cpu: 500m, memory: 1Gi }
        readinessProbe:
          httpGet: { path: /, port: 8080 }
          initialDelaySeconds: 3
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: { path: /, port: 8080 }
          initialDelaySeconds: 10
          timeoutSeconds: 10
          failureThreshold: 12
        volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: app-memory
spec:
  selector: { app: app-memory }
  ports: [{ port: 8080, targetPort: 8080 }]
