apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: app-gateway }
  template:
    metadata:
      labels: { app: app-gateway }
    spec:
      containers:
      - name: nginx
        image: app-gateway:1.0
        imagePullPolicy: Never
        ports: [{ containerPort: 8080 }]
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits:   { cpu: 200m, memory: 128Mi }
        readinessProbe:
          httpGet: { path: /, port: 8080 }
          initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: app-gateway
spec:
  type: NodePort
  selector: { app: app-gateway }
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
